<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Restablecer contraseña - Finance Flow</title>
    <link rel="apple-touch-icon" href="./public/logo.png">
    <link rel="icon" type="image/png" href="./public/logo.png">
    <link rel="shortcut icon" type="image/png" href="./public/logo.png">
    <script src="./public/config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        :root {
            --azul: #0158C9;
            --azul-osc: #013F92;
            --azul-claro: #5EC6FF;
            --verde: #61CE70;
            --tinta: #0f1b2d;
            --gris: #5b6675;
            --error: #e02424;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background:
                radial-gradient(900px 600px at 15% -10%, rgba(94,198,255,.20), transparent 60%),
                radial-gradient(800px 600px at 110% 10%, rgba(97,206,112,.18), transparent 55%),
                linear-gradient(160deg, #f4f8ff 0%, #eef3fb 100%);
            color: var(--tinta);
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 22px;
            padding: 2.4rem 2.1rem;
            box-shadow: 0 24px 60px rgba(1,63,146,.16), 0 4px 12px rgba(15,27,45,.05);
            animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
        }
        @keyframes rise { from { opacity:0; transform: translateY(14px);} to {opacity:1; transform:none;} }
        .brand {
            display: flex; align-items: center; gap: .6rem;
            margin-bottom: 1.8rem;
        }
        .brand img { width: 38px; height: 38px; border-radius: 9px; }
        .brand span { font-weight: 800; font-size: 1.25rem; color: var(--azul); letter-spacing: -.5px; }
        h1 {
            font-size: 1.55rem; font-weight: 800; letter-spacing: -.6px;
            margin-bottom: .5rem; line-height: 1.2;
        }
        .sub { color: var(--gris); font-size: .96rem; line-height: 1.55; margin-bottom: 1.7rem; }
        label { display:block; font-weight:600; font-size:.85rem; margin-bottom:.45rem; }
        .field { position: relative; margin-bottom: 1.1rem; }
        .field input {
            width: 100%; padding: .85rem 2.6rem .85rem 1rem;
            border: 1.7px solid #e2e8f2; border-radius: 12px;
            font-size: 1rem; font-family: inherit; transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus { outline:none; border-color: var(--azul); box-shadow: 0 0 0 4px rgba(1,88,201,.12); }
        .toggle-eye {
            position:absolute; right:.5rem; top:50%; transform:translateY(-50%);
            background:none; border:none; color:var(--gris); cursor:pointer; padding:.5rem; font-size:.95rem;
        }
        .hint { font-size:.8rem; color:var(--gris); margin-top:-.5rem; margin-bottom:1.1rem; }
        .btn {
            width:100%; border:none; border-radius:12px; cursor:pointer;
            padding:.95rem; font-size:1rem; font-weight:700; font-family:inherit;
            background: var(--azul); color:#fff; transition: background .15s, transform .1s;
            display:flex; align-items:center; justify-content:center; gap:.5rem;
        }
        .btn:hover { background: var(--azul-osc); }
        .btn:active { transform: scale(.99); }
        .btn:disabled { opacity:.65; cursor:not-allowed; }
        .msg { border-radius:12px; padding:.85rem 1rem; font-size:.9rem; margin-bottom:1.1rem; display:none; line-height:1.45; }
        .msg.error { background:#fdecec; color:var(--error); border:1px solid #f7c5c5; display:block; }
        .msg.ok { background:#eafaed; color:#1b7a2b; border:1px solid #bce8c4; display:block; }
        .back { display:block; text-align:center; margin-top:1.4rem; color:var(--azul); font-weight:600; font-size:.9rem; text-decoration:none; }
        .back:hover { text-decoration:underline; }
        .success-box { text-align:center; display:none; }
        .success-box .circle {
            width:72px; height:72px; border-radius:50%; background:rgba(97,206,112,.15);
            display:flex; align-items:center; justify-content:center; margin:0 auto 1.2rem;
        }
        .success-box .circle i { font-size:2rem; color:var(--verde); }
        .strength { height:5px; border-radius:99px; background:#e9eef6; margin:-.4rem 0 1rem; overflow:hidden; }
        .strength > div { height:100%; width:0; transition:width .25s, background .25s; border-radius:99px; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Estado 1: formulario -->
        <div id="form-state">
            <div class="brand">
                <img src="./public/logo.png" alt="Finance Flow">
                <span>Finance Flow</span>
            </div>
            <h1>Crea tu nueva contraseña</h1>
            <p class="sub">Introduce una contraseña segura para volver a acceder a tu cuenta. Debe tener al menos 8 caracteres.</p>

            <div id="msg" class="msg"></div>

            <form id="reset-form" autocomplete="off">
                <label for="pw">Nueva contraseña</label>
                <div class="field">
                    <input type="password" id="pw" placeholder="Mínimo 8 caracteres" required>
                    <button type="button" class="toggle-eye" data-target="pw"><i class="fas fa-eye"></i></button>
                </div>
                <div class="strength"><div id="strength-bar"></div></div>

                <label for="pw2">Repite la contraseña</label>
                <div class="field">
                    <input type="password" id="pw2" placeholder="Vuelve a escribirla" required>
                    <button type="button" class="toggle-eye" data-target="pw2"><i class="fas fa-eye"></i></button>
                </div>

                <button type="submit" class="btn" id="submit-btn">
                    <span>Guardar contraseña</span>
                </button>
            </form>
            <a href="./login.html" class="back">Volver a iniciar sesión</a>
        </div>

        <!-- Estado 2: éxito -->
        <div id="success-state" class="success-box">
            <div class="circle"><i class="fas fa-check"></i></div>
            <h1>¡Contraseña actualizada!</h1>
            <p class="sub">Ya puedes iniciar sesión con tu nueva contraseña.</p>
            <a href="./login.html" class="btn" style="text-decoration:none;">Ir a iniciar sesión</a>
        </div>
    </div>

    <script>
        const API_URL = window.API_URL || 'https://financeflow.victor-a97.workers.dev/api';
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const msg = document.getElementById('msg');
        const form = document.getElementById('reset-form');
        const btn = document.getElementById('submit-btn');
        const pw = document.getElementById('pw');
        const pw2 = document.getElementById('pw2');
        const bar = document.getElementById('strength-bar');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        // Si no hay token en la URL, el enlace no es válido
        if (!token) {
            showMsg('Enlace no válido. Solicita uno nuevo desde "He olvidado mi contraseña".', 'error');
            form.style.display = 'none';
        }

        // Mostrar/ocultar contraseña
        document.querySelectorAll('.toggle-eye').forEach(b => {
            b.addEventListener('click', () => {
                const t = document.getElementById(b.dataset.target);
                const icon = b.querySelector('i');
                if (t.type === 'password') { t.type = 'text'; icon.className = 'fas fa-eye-slash'; }
                else { t.type = 'password'; icon.className = 'fas fa-eye'; }
            });
        });

        // Indicador de fuerza
        pw.addEventListener('input', () => {
            const v = pw.value; let score = 0;
            if (v.length >= 8) score++;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
            if (/\d/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const pct = [0, 25, 55, 80, 100][score];
            const col = ['#e9eef6', '#e02424', '#e8a33d', '#5EC6FF', '#61CE70'][score];
            bar.style.width = pct + '%';
            bar.style.background = col;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (pw.value.length < 8) { showMsg('La contraseña debe tener al menos 8 caracteres.', 'error'); return; }
            if (pw.value !== pw2.value) { showMsg('Las contraseñas no coinciden.', 'error'); return; }

            btn.disabled = true;
            btn.querySelector('span').textContent = 'Guardando...';
            msg.className = 'msg';

            try {
                const r = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pw.value })
                });
                const data = await r.json();
                if (r.ok && data.success) {
                    document.getElementById('form-state').style.display = 'none';
                    document.getElementById('success-state').style.display = 'block';
                } else {
                    showMsg(data.error || 'No se pudo restablecer la contraseña. El enlace puede haber caducado.', 'error');
                    btn.disabled = false;
                    btn.querySelector('span').textContent = 'Guardar contraseña';
                }
            } catch (err) {
                showMsg('Error de conexión. Inténtalo de nuevo.', 'error');
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Guardar contraseña';
            }
        });
    </script>
</body>
</html>
