<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./public/logo.png">
    <link rel="shortcut icon" type="image/png" href="./public/logo.png">
    <title>Sin Conexión - FinanceFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <i class="fas fa-wifi-slash text-6xl text-gray-400 mb-6"></i>
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Sin Conexión</h1>
        <p class="text-gray-600 mb-8 max-w-md">
            Parece que no tienes conexión a Internet. 
            Verifica tu conexión y vuelve a intentarlo.
        </p>
        <button 
            onclick="window.location.reload()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors"
        >
            <i class="fas fa-sync-alt mr-2"></i>
            Intentar de nuevo
        </button>
    </div>
</body>
</html>
