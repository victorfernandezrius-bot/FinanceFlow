# Dependabot: PRs semanales con actualizaciones de dependencias npm y de las
# GitHub Actions. Revísalas antes de fusionar: un merge a main despliega el frontend.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
